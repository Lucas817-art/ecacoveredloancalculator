<!DOCTYPE html>
<html lang="zh" data-default-langs="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinosure Supported Facility</title>
<style>
:root{
  --navy:#0d2440; --navy2:#173d68; --ink:#1f2a37; --muted:#6b7b8f; --line:#e4ebf3;
  --bg:#f3f6fa; --card:#fff; --gold:#c8a24a; --gold2:#e6cf94; --teal:#1f6f5c;
  --shadow:0 2px 12px rgba(16,42,67,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Inter","Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,Arial,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  font-size:13px; line-height:1.45;
}
.esc{font-variant-numeric:tabular-nums}
.xl2{display:block;font-size:10px;color:#93a1b3;font-weight:500;line-height:1.3}
.unit{font-size:11px;color:#7d8b9c;font-weight:500;margin-left:1px;letter-spacing:0}

/* ---------- app bar ---------- */
.appbar{
  position:sticky; top:0; z-index:30;
  background:linear-gradient(115deg,#0b1f38 0%,#16395f 60%,#1d4a78 100%);
  color:#fff; padding:11px 24px; display:flex; align-items:center; justify-content:space-between;
  gap:16px; flex-wrap:wrap; box-shadow:0 8px 24px rgba(9,26,46,.22);
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.logo{
  width:40px;height:40px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(140deg,#e8d29b,#c8a24a);
  display:grid;place-items:center;color:#0d2440;font-weight:800;font-size:12px;letter-spacing:.8px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);
}
.brand h1{margin:0;font-size:16.5px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand .sub{margin:2px 0 0;font-size:11px;color:rgba(255,255,255,.66);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:flex;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:9px;padding:3px;gap:2px}
.seg button{
  border:0;background:transparent;color:rgba(255,255,255,.72);font:inherit;font-size:11.5px;
  padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:.15s;
}
.seg button:hover{color:#fff}
.seg button.on{background:#fff;color:#12314f;font-weight:600}
.mini-select{
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);color:#fff;
  border-radius:8px;height:30px;padding:0 8px;font:inherit;font-size:11.5px;cursor:pointer;
}
.mini-select option{color:#1f2a37}
.btn{
  border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;
  border-radius:8px;height:32px;padding:0 13px;font:inherit;font-size:12px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:linear-gradient(135deg,#e8d29b,#c8a24a);color:#0d2440;border-color:transparent;font-weight:650}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}


/* equity/debt, IRR, FX */
.edfield{display:block}
.edfield .fl{display:block}
.edfield .fl .xl2{display:block;margin-top:1px}
.edbox{display:flex;align-items:center;gap:6px;margin-top:7px}
.edbox .inp{flex:0 0 auto}
.edbox .inp input{width:66px;text-align:right;padding-right:22px;font-size:12px}
.edtag{font-size:10px;font-weight:700;color:#8b99aa;letter-spacing:.5px}
.edcolon{font-weight:600;color:#8b99aa;font-size:12px}
.edhint{font-size:10px;color:#93a1b3;margin-left:2px;white-space:nowrap}

.irrcard .card-head .meta{font-size:10px;color:#93a1b3;font-weight:400;max-width:56%;line-height:1.4}
.irrgrid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.irrcell{background:#f8fafd;border:1px solid #e9eff6;border-radius:10px;padding:8px 11px}
.irrcell.hero{background:linear-gradient(135deg,#f3f7fc,#eaf1f9);border-color:#dbe6f2}
.irrcell .kl{font-size:10px;color:#7e8da0;line-height:1.35}
.irrgrid .kv{font-size:20px;font-weight:650;color:#10263d;margin-top:2px;font-variant-numeric:tabular-nums}
.irrcell .kv.small{font-size:15px}
.irrcell .kv.gold{color:#8a6a1f}

.fxpick{position:relative}
.fxbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border-radius:8px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}
.fxbtn:hover{background:rgba(255,255,255,.18)}
.fxdot{width:6px;height:6px;border-radius:50%;background:#7fd6a8}
.fxi{width:74px;text-align:right;border:0;border-bottom:1px dashed #cbd7e4;background:transparent;font:inherit;font-weight:600;font-size:11px;color:#10263d;padding:0 0 1px 0}
.fxi:focus{outline:none;border-bottom-color:#c8a24a}
.fxtag{font-style:normal;font-size:8.5px;color:#8a6a1f;background:#f6eeda;border-radius:3px;padding:0 3px;margin-left:3px;vertical-align:1px}
.fxrst{margin-left:6px;background:none;border:1px solid #d9e2ec;border-radius:6px;font-size:10px;color:#41556b;padding:3px 6px;cursor:pointer}
.fxmenu{position:absolute;right:0;top:38px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 14px 34px rgba(10,26,45,.20);padding:10px;min-width:262px;z-index:60}
.fxmenu[hidden]{display:none}
.fxmenu h4{margin:0 0 6px;font-size:11px;color:#6b7b8f;font-weight:600;letter-spacing:.02em}
.fxrow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:4px 0;border-bottom:1px dashed #eef2f7}
.fxrow:last-of-type{border-bottom:0}
.fxrow b{font-variant-numeric:tabular-nums}
.fxfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid #eef3f8;font-size:10px;color:#8b99aa}
.fxfoot button{border:1px solid #d9e2ec;background:#f7fafd;border-radius:7px;height:24px;padding:0 9px;font:inherit;font-size:10.5px;color:#3b5468;cursor:pointer}

/* ---------- layout ---------- */
.shell{max-width:1560px;margin:0 auto;padding:18px 24px 40px;display:grid;grid-template-columns:346px minmax(0,1fr);gap:18px;align-items:start}
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:14px 16px 12px;position:sticky;top:82px;max-height:calc(100vh - 100px);overflow:auto;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.panel h2{font-size:13px;margin:0;font-weight:650;color:#12283f;display:flex;align-items:baseline;gap:6px}
.panel h2 .xl2{font-size:10px;color:#93a1b3;font-weight:500}
.panel .hintline{font-size:10.5px;color:#93a1b3;margin:2px 0 8px;line-height:1.4}
.group{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#8b99aa;font-weight:600;margin:12px 0 2px;padding-top:8px;border-top:1px solid #eef3f8}
.group:first-of-type{border-top:0;margin-top:2px}
.field{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed #f0f4f9}
.field:last-child{border-bottom:0}
.field .fl{flex:1;min-width:0;font-size:11.5px;color:#3f4d60;line-height:1.25}
.field .fl .xl2{display:block;color:#97a4b5;font-size:10px;margin-top:1px}
.inp{position:relative;flex:0 0 auto}
.inp input,.inp select{
  width:124px;height:31px;border:1px solid #d9e2ec;border-radius:7px;background:#fbfdff;
  padding:0 34px 0 9px;font:inherit;font-size:12.5px;color:#12212f;text-align:right;
  font-variant-numeric:tabular-nums;outline:none;transition:.15s;
}
.inp select{padding-right:22px;text-align:left}
.inp input:focus,.inp select:focus{border-color:#7ea6cc;box-shadow:0 0 0 3px rgba(30,74,118,.10);background:#fff}
.inp .sfx{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:9.5px;color:#9aa8b8;pointer-events:none;letter-spacing:.02em}
.inp #inPrice{width:142px}
.inp #inPremBasis{width:176px}
.inp #inRepType{width:176px}
[hidden]{display:none!important}
.inp.wide-sfx input{padding-right:52px}
.inp.wide-sfx .sfx{right:8px}
.field.period{flex-wrap:wrap}
.fhint{font-size:9.5px;color:#9aa8b8;text-align:right;flex:0 0 100%;margin-top:-3px;line-height:1.2;min-height:11px}
.fhint{font-size:9.5px;color:#9aa8b8;text-align:right;margin-top:-2px;line-height:1.2}
.inp input[type=date]{text-align:left;padding-right:8px;font-size:11.5px}
.switch{width:42px;height:22px;border-radius:12px;background:#dbe4ee;position:relative;cursor:pointer;transition:.18s;flex:0 0 auto}
.switch::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.switch.on{background:linear-gradient(135deg,#1d4a78,#173d68)}
.switch.on::after{left:23px}
.derived{margin-top:10px;background:#f7fafd;border:1px solid #e7eef6;border-radius:10px;padding:8px 10px}
.derived .row{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:3px 0;color:#5a6b80}
.derived .row b{font-weight:650;color:#16283d;font-variant-numeric:tabular-nums}

/* ---------- alert ---------- */
.alert{
  margin:0 0 12px;border:1px solid #f3d7a2;background:#fff9ec;color:#8a5a12;border-radius:10px;
  padding:9px 12px;font-size:12px;display:flex;gap:8px;align-items:flex-start;
}
.alert[hidden]{display:none}

/* ---------- cards ---------- */
.content{min-width:0;display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px 10px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#dbe6f1}
.kpi.gold::before{background:linear-gradient(#e6cf94,#c8a24a)}
.kpi.navy::before{background:linear-gradient(#2c5f96,#173d68)}
.kpi .kl{font-size:10px;color:#7e8da0;line-height:1.35;min-height:26px}
.kpi .kv{font-size:19px;font-weight:650;letter-spacing:-.3px;color:#10263d;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .kv .cur{font-size:10.5px;color:#8fa0b3;font-weight:500;margin-right:2px;letter-spacing:0}
.kpi .ks{font-size:10px;color:#8b99aa;margin-top:3px;line-height:1.3}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px 12px;min-width:0}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.card-head h3{margin:0;font-size:13px;font-weight:650;color:#12283f;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.card-head h3 .xl2{font-size:10.5px;color:#93a1b3;font-weight:500}
.card-head .meta{font-size:10.5px;color:#8b99aa;display:flex;align-items:center;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-size:10px;border:1px solid #cfe6da;background:#f2fbf6;color:#1f6f5c;white-space:nowrap}
.badge[hidden]{display:none}
.badge.warn{border-color:#f0dcb0;background:#fff9ec;color:#8a5a12}
.badge.plain{border-color:#dfe8f2;background:#f5f9fd;color:#526278}

/* chart */
.chartbox{padding-top:2px}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10.5px;color:#5c6d81;margin:2px 0 6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:1px}
.legend .ln{width:14px;height:2px;border-radius:2px;background:#9fb0c3;vertical-align:4px}

/* table */
.tbl-tools{display:flex;align-items:center;gap:10px;font-size:10.5px;color:#8b99aa;flex-wrap:wrap}
.tbl-tools select{border:1px solid #dfe7f0;border-radius:6px;height:26px;padding:0 6px;font:inherit;font-size:10.5px;background:#fff;color:#38506b}
.tblwrap{overflow-x:auto;border:1px solid #e6ecf3;border-radius:10px;margin-top:4px}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:11.8px;font-variant-numeric:tabular-nums;white-space:nowrap}
table.grid thead th{
  position:sticky;top:0;z-index:3;background:#f7f9fc;color:#43546b;font-weight:600;font-size:10px;
  padding:7px 10px;text-align:right;border-bottom:1px solid #dbe5f0;line-height:1.35;vertical-align:bottom;
}
table.grid thead th .xl2{display:block;color:#98a6b7;font-weight:500;font-size:9px}
table.grid thead th:first-child,table.grid thead th:nth-child(2){text-align:left}
table.grid thead th.l{text-align:left}
table.grid tbody td{padding:5.5px 10px;text-align:right;border-bottom:1px solid #f2f6fa;color:#1b2a3a}
table.grid tbody td.l{text-align:left}
table.grid tbody tr:nth-child(even) td{background:#fbfcfe}
table.grid tbody tr:hover td{background:#f1f7ff}
table.grid tbody tr.grace td:first-child{box-shadow:inset 3px 0 0 #c8a24a}
table.grid tbody tr.final td{background:#fffaef}
table.grid tr.total td{font-weight:700;background:#f6f9fd;border-top:2px solid #dde7f2;color:#0f2740}
.grace-tag{display:inline-block;font-size:9px;color:#8a6414;background:#fdf3d9;border-radius:4px;padding:0 4px;margin-left:4px;vertical-align:1px}

/* sensitivity */
.senswrap{overflow-x:auto}
.sens{width:100%;min-width:330px;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
.sens th{font-size:10px;color:#7e8da0;font-weight:600;text-align:right;padding:5px 5px;border-bottom:1px solid #e7eef6;line-height:1.3}
.sens th:first-child{text-align:left}
.sens td{padding:5px 5px;text-align:right;border-bottom:1px solid #f2f6fa;color:#22364c}
.sens td:first-child{text-align:left;font-weight:600;color:#3c5168}
.sens tr.base td{background:#fffaf0}
.sens tr.base td:first-child{color:#8a6414}
.sens .pos{color:#a5522c}
.sens .neg{color:#1f6f5c}
.sens .note{font-size:10px;color:#93a1b3;margin-top:8px;line-height:1.45}

.row2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}

/* notes */
details.notes{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:0}
details.notes summary{cursor:pointer;padding:13px 16px;font-size:12.5px;font-weight:650;color:#12283f;list-style:none;display:flex;align-items:center;gap:8px}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:"›";color:#c8a24a;font-weight:700;transition:.2s;display:inline-block}
details.notes[open] summary::before{transform:rotate(90deg)}
details.notes .body{padding:0 16px 14px;border-top:1px solid #f0f4f9}
details.notes ol{margin:8px 0 0;padding-left:18px;color:#4a5b70;font-size:11.5px;line-height:1.55}
details.notes li{margin-bottom:6px}
details.notes li .xl2{display:block;color:#8f9dae;font-size:10.5px;margin-top:2px}

footer{max-width:1560px;margin:0 auto;padding:0 24px 26px;font-size:10px;color:#9aa8b8;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}


/* ---------- language picker / live rate ---------- */
.langpick{position:relative}
.langbtn{
  display:flex;align-items:center;gap:7px;height:30px;padding:0 9px;border-radius:8px;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;
  font:inherit;font-size:11.5px;cursor:pointer;transition:.15s;white-space:nowrap;
}
.langbtn:hover{background:rgba(255,255,255,.18)}
.langbtn .caret{font-size:9px;opacity:.7}
.flags{display:inline-flex;align-items:center}
.flag{width:17px;height:11px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.flags .flag + .flag{margin-left:2px}
.langmenu{
  position:absolute;right:0;top:38px;background:#fff;color:var(--ink);border:1px solid var(--line);
  border-radius:10px;box-shadow:0 14px 34px rgba(10,26,45,.20);padding:5px;min-width:206px;z-index:60;
}
.langmenu[hidden]{display:none}
.langmenu button{
  display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  padding:7px 9px;border-radius:7px;font:inherit;font-size:12px;color:#22364b;cursor:pointer;text-align:left;
}
.langmenu button:hover{background:#f2f6fa}
.langmenu button.on{background:#e9f1f9;font-weight:600}
.langmenu .lname{flex:1}
.livebar{display:flex;align-items:center;gap:8px;padding:6px 0 1px;flex-wrap:wrap}
.chipbtn{
  border:1px solid #d9e2ec;background:#f7fafd;border-radius:7px;height:24px;padding:0 9px;
  font:inherit;font-size:10.5px;color:#3b5468;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:.15s;
}
.chipbtn:hover{border-color:#b9cde1;background:#eef4fa}
.chipbtn[disabled]{opacity:.6;cursor:default}
.chipbtn .spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.srclink{color:#2f6fa8;text-decoration:none;font-weight:650;padding:0 1px}
.liveinfo{font-size:10px;color:#7d8b9c;display:block;flex:1 1 100%;min-width:0;line-height:1.4}
.dot{width:6px;height:6px;border-radius:50%;background:#c3cdd8;display:inline-block;vertical-align:middle;margin-right:4px}
.dot.live{background:#1f9d63;box-shadow:0 0 0 2px rgba(31,157,99,.14)}
.dot.ref{background:#2f6fa8}
.dot.manual{background:#c8a24a}
.dot.fail{background:#c05b5b}

@media (max-width:1360px){
  table.grid{font-size:11px}
  table.grid tbody td{padding:5px 5px}
  table.grid thead th{padding:6px 5px}
  .sens{font-size:10.5px}
  .sens td,.sens th{padding:4px 4px}
}
@media (max-width:1240px){.irrgrid{grid-template-columns:1.4fr 1fr 1fr}}
@media (max-width:760px){.irrgrid{grid-template-columns:1fr 1fr}.irrcell.hero{grid-column:1/-1}}
@media (max-width:1240px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.row2{grid-template-columns:1fr}}
@media (max-width:1040px){
  .shell{grid-template-columns:1fr;padding:14px}
  .panel{position:static;max-height:none}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brand .sub{max-width:80vw}
}
@media (max-width:560px){
  .appbar{padding:10px 14px;gap:10px}
  .inp input,.inp select{width:132px;font-size:12px;padding-right:28px}
  .toolbar,.tools{gap:8px}
  .brand h1{font-size:15px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi .kv{font-size:16px}
  .kpi .ks{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.35}
  .btn{padding:0 9px;font-size:11px}
  table.grid{font-size:11px}
  table.grid tbody td{padding:5px 8px}
  table.grid thead th{padding:6px 8px}
  .card{padding:12px}
  .sens{font-size:10px;min-width:340px}
  .sens th{font-size:9px;padding:4px 4px}
  .sens td{padding:4px 4px}
}
@media print{
  @page{size:A4 landscape;margin:9mm}
  body{background:#fff;font-size:11px}
  .appbar{position:static;background:#fff;color:#10263d;box-shadow:none;border-bottom:1px solid #ccc;padding:6px 0}
  .brand .sub,.tools,.livebar{display:none}
  .logo{display:none}
  .shell{display:block;max-width:none;padding:0}
  .panel{position:static;max-height:none;box-shadow:none;border:0;padding:0;margin-bottom:12px;
    display:grid;grid-template-columns:1fr 1fr;column-gap:26px}
  .panel-head,.panel .hintline,.panel .derived{grid-column:1/-1}
  .card,.kpi,.panel{box-shadow:none;break-inside:avoid}
  .kpi{overflow:visible}
  .kpis{grid-auto-rows:auto}
  .card,.kpi{border-color:#d9e2ec}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

  return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] || 1));
}
function eomAdd(iso, months) {
  var d = toDate(iso);
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + months + 1, 0));
}
function daysBetween(a, b) {
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
function isoOf(d) {
  var m = String(d.getUTCMonth() + 1), dd = String(d.getUTCDate());
  return d.getUTCFullYear() + '-' + (m.length < 2 ? '0' + m : m) + '-' + (dd.length < 2 ? '0' + dd : dd);
}

function buildSchedule(facility, inp) {
  var freq = inp.freq;
  var months = 12 / freq;
  var nPay = Math.max(1, Math.round(inp.repYears * freq));
  var nGrace = Math.max(0, Math.round(inp.ddYears * freq));
  var nTranche = nGrace > 0 ? nGrace : 1;
  var total = nGrace + nPay;
  var rows = [];
  var prevEnd = toDate(inp.start);
  var bal = 0;
  var perTranche = facility / nTranche;
  for (var k = 1; k <= total; k++) {
    var end = eomAdd(inp.start, k * months);
    var days = daysBetween(prevEnd, end);
    var opening = bal;
    var drawdown = 0;
    if (k <= nTranche) drawdown = (k === nTranche) ? facility - perTranche * (nTranche - 1) : perTranche;
    var balShare = inp.repayType === 'balloon' ? Math.max(0, Math.min(1, inp.balloonShare === undefined ? 1 : inp.balloonShare)) : 0;
    var amortBase = facility * (1 - balShare);
    var principal = (k > nGrace) ? (inp.repayType === 'balloon' ? amortBase / nPay : facility / nPay) : 0;
    if (k === total) principal = opening + drawdown;
    var baseInt = (opening + drawdown) * inp.baseRate * days / inp.basis;
    var marginInt = (opening + drawdown) * inp.margin * days / inp.basis;
    var closing = opening + drawdown - principal;
    if (Math.abs(closing) < 1e-6) closing = 0;
    rows.push({
      period: k,
      end: isoOf(end),
      days: days,
      opening: opening,
      drawdown: drawdown,
      principal: principal,
      closing: closing,
      baseInt: baseInt,
      marginInt: marginInt,
      interest: baseInt + marginInt,
      total: principal + baseInt + marginInt
    });
    bal = closing;
    prevEnd = end;
  }
  var tot = { drawdown: 0, principal: 0, baseInt: 0, marginInt: 0, interest: 0, total: 0 };
  rows.forEach(function (r) {
    tot.drawdown += r.drawdown;
    tot.principal += r.principal;
    tot.baseInt += r.baseInt;
    tot.marginInt += r.marginInt;
    tot.interest += r.interest;
    tot.total += r.total;
  });
  return { rows: rows, totals: tot, nPay: nPay, nGrace: nGrace };
}

function xirr(flows) {
  if (!flows || flows.length < 2) return NaN;
  var t0 = toDate(flows[0].date).getTime();
  function npv(r) {
    var s = 0;
    for (var i = 0; i < flows.length; i++) {
      var y = (toDate(flows[i].date).getTime() - t0) / (86400000 * 365);
      s += flows[i].amount / Math.pow(1 + r, y);
    }
    return s;
  }
  function dnpv(r) {
    var s = 0;
    for (var i = 0; i < flows.length; i++) {
      var y = (toDate(flows[i].date).getTime() - t0) / (86400000 * 365);
      s -= y * flows[i].amount / Math.pow(1 + r, y + 1);
    }
    return s;
  }
  var r = 0.05;
  for (var k = 0; k < 100; k++) {
    var f = npv(r);
    if (!isFinite(f)) break;
    var d = dnpv(r);
    if (!isFinite(d) || Math.abs(d) < 1e-14) break;
    var nr = r - f / d;
    if (!isFinite(nr)) break;
    if (Math.abs(nr - r) < 1e-10) { r = nr; break; }
    r = nr;
  }
  if (isFinite(npv(r)) && Math.abs(npv(r)) < 1e-6) return r;
  var lo = -0.9999, hi = 1.0, flo = npv(lo), fhi = npv(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return NaN;
  for (var j = 0; j < 240; j++) {
    var mid = (lo + hi) / 2, fm = npv(mid);
    if (flo * fm <= 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}

function cashFlows(rows, startIso, prem, nPay, premMode) {
  var flows = [];
  var p = premMode === 'none' ? 0 : prem;
  if (premMode === 'actual' && p > 0) flows.push({ date: startIso, amount: -p });
  var prev = startIso;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.drawdown) flows.push({ date: prev, amount: r.drawdown });
    var amt = -(r.principal + r.interest);
    if (premMode === 'spread' && r.principal > 0 && nPay > 0) amt -= p / nPay;
    flows.push({ date: r.end, amount: amt });
    prev = r.end;
  }
  return flows;
}

var BASE_LABEL = { USD: 'fBaseSOFR', CNY: 'fBaseLPR', EUR: 'fBaseESTR', GBP: 'fBaseSONIA' };

function compute(inp) {
  inp = Object.assign({}, inp);
  if (inp.debtShare === undefined && inp.ltv !== undefined) inp.debtShare = inp.ltv;
  var premRatio = inp.premFinanceRatio;
  if (premRatio === undefined) premRatio = inp.premFinanced ? 0.85 : 0;
  premRatio = Math.max(0, Math.min(0.85, premRatio || 0));
  inp.premFinanceRatio = premRatio;
  var debt = inp.debtShare;
  var loan = inp.price * debt;
  var prem = 0, facility = 0, sch = null, insured = 0, guard = 0;
  var maxIter = premRatio > 0 ? 80 : 1;
  while (guard++ < maxIter) {
    facility = loan + prem * premRatio + (inp.finIDC || 0);
    sch = buildSchedule(facility, inp);
    insured = facility + sch.totals.interest;
    var newPrem = inp.premRate * (inp.premBasis === 'PI' ? insured : facility);
    if (Math.abs(newPrem - prem) < 0.005) { prem = newPrem; break; }
    prem = newPrem;
  }
  facility = loan + prem * premRatio + (inp.finIDC || 0);
  sch = buildSchedule(facility, inp);
  insured = facility + sch.totals.interest;

  var nPayCount = 0;
  sch.rows.forEach(function (r) { if (r.principal > 0) nPayCount++; });
  /* no-premium counterfactual: same loan + IDC, no insurance premium */
  var schNone = buildSchedule(loan + (inp.finIDC || 0), inp);
  var nPayNone = 0;
  schNone.rows.forEach(function (r) { if (r.principal > 0) nPayNone++; });
  var fAll = cashFlows(sch.rows, inp.start, prem, nPayCount, 'actual');
  var fNone = cashFlows(schNone.rows, inp.start, prem, nPayNone, 'none');
  var fSpread = cashFlows(schNone.rows, inp.start, prem, nPayNone, 'spread');
  var irrAllIn = xirr(fAll);
  var irrExcl = xirr(fNone);
  var irrSpread = xirr(fSpread);
  var bpUpfront = (isFinite(irrAllIn) && isFinite(irrExcl)) ? (irrAllIn - irrExcl) * 10000 : NaN;
  var bpSpread = (isFinite(irrSpread) && isFinite(irrExcl)) ? (irrSpread - irrExcl) * 10000 : NaN;

  var startD = toDate(inp.start);
  var wal = 0;
  sch.rows.forEach(function (r) {
    wal += r.principal * daysBetween(startD, toDate(r.end)) / 365.25;
  });
  wal = facility > 0 ? wal / facility : 0;

  return {
    loan: loan,
    facility: facility,
    premium: prem,
    financedPremium: prem * premRatio,
    premiumPrepay: prem * (1 - premRatio),
    premFinanceRatio: premRatio,
    balloonShare: premRatio >= 0 ? (inp.repayType === 'balloon' ? Math.max(0, Math.min(1, inp.balloonShare === undefined ? 1 : inp.balloonShare)) : 0) : 0,
    insured: insured,
    interest: sch.totals.interest,
    principal: sch.totals.principal,
    pi: sch.totals.principal + sch.totals.interest,
    pRate: facility > 0 ? prem / facility : 0,
    equity3: insured * 3,
    wal: wal,
    allIn: inp.baseRate + inp.margin,
    debtShare: debt,
    equity: 1 - debt,
    irrAllIn: irrAllIn,
    irrExcl: irrExcl,
    irrSpread: irrSpread,
    bpUpfront: bpUpfront,
    bpSpread: bpSpread,
    nPayCount: nPayCount,
    flows: fAll,
    ratio: facility > 0 ? sch.totals.interest / facility : 0,
    periods: sch.rows.length,
    firstDate: sch.rows[0] ? sch.rows[0].end : '',
    lastDate: sch.rows.length ? sch.rows[sch.rows.length - 1].end : '',
    tenorMonths: inp.ddYears * 12 + inp.repYears * 12,
    rows: sch.rows,
    totals: sch.totals,
    nGrace: sch.nGrace,
    nPay: sch.nPay,
    inp: inp
  };
}

function computeAtRate(inp, rate) {
  var c = Object.assign({}, inp, { baseRate: rate });
  return compute(c);
}

function validate(inp) {
  var msgs = [];
  if (!(inp.price > 0)) msgs.push('vPrice');
  var ds = inp.debtShare === undefined ? inp.ltv : inp.debtShare;
  if (!(ds > 0) || ds > 1) msgs.push('vLtv');
  if (!(inp.repYears >= 1)) msgs.push('vRepay');
  if (!(inp.premRate > 0)) msgs.push('vPrem');
  if (inp.baseRate < 0 || inp.margin < 0) msgs.push('vRate');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(inp.start)) msgs.push('vDate');
  if (inp.ddYears > inp.repYears) msgs.push('vDrawdown');
  return msgs;
}

var CRC_TABLE = (function () {
  var t = new Int32Array(256);
  for (var n = 0; n < 256; n++) {
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();

function crc32(u8) {
  var c = 0xFFFFFFFF;
  for (var i = 0; i < u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function strBytes(s) {
  if (typeof TextEncoder !== 'undefined') return new TextEncoder().encode(s);
  var b = Buffer.from(s, 'utf8');
  return new Uint8Array(b);
}

function zipStore(files) {
  var parts = [], central = [], offset = 0;
  var enc = strBytes;
  files.forEach(function (f) {
    var name = enc(f.name);
    var data = f.data;
    var crc = crc32(data);
    var lh = new Uint8Array(30 + name.length);
    var dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, 0x21, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, name.length, true);
    dv.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);

    var cd = new Uint8Array(46 + name.length);
    var cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint32(42, offset, true);
    cd.set(name, 46);
    central.push(cd);
    offset += lh.length + data.length;
  });
  var cdSize = 0;
  central.forEach(function (c) { cdSize += c.length; });
  var eocd = new Uint8Array(22);
  var ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  var total = offset + cdSize + 22;
  var out = new Uint8Array(total);
  var pos = 0;
  parts.forEach(function (p) { out.set(p, pos); pos += p.length; });
  central.forEach(function (p) { out.set(p, pos); pos += p.length; });
  out.set(eocd, pos);
  return out;
}

function xmlEsc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c];

}

function colName(n) {
  var s = '';
  while (n > 0) { var m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}

/* cell: null | string | number | {v, s, f, type} */
function cellXml(ref, c) {
  if (c === null || c === undefined || c === '') return '';
  if (typeof c === 'string') {
    return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(c) + '</t></is></c>';
  }
  if (typeof c === 'number') {
    return '<c r="' + ref + '"><v>' + (isFinite(c) ? c : 0) + '</v></c>';
  }
  var attrs = ' r="' + ref + '"';
  if (c.s != null) attrs += ' s="' + c.s + '"';
  if (c.type === 'str' || typeof c.v === 'string') {
    return '<c' + attrs + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEsc(c.v == null ? '' : c.v) + '</t></is></c>';
  }
  if (c.f) {
    return '<c' + attrs + '><f>' + xmlEsc(c.f) + '</f><v>' + (c.v == null ? 0 : c.v) + '</v></c>';
  }
  return '<c' + attrs + '><v>' + (c.v == null ? 0 : c.v) + '</v></c>';
}

function sheetXml(rows, opts) {

  var maxCol = 1;
  rows.forEach(function (r) { if (r && r.length > maxCol) maxCol = r.length; });
  var dim = 'A1:' + colName(maxCol) + rows.length;

      return '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + w + '" customWidth="1"/>';
    }).join('') + '</cols>';

  var sheetData = rows.map(function (row, ri) {
    if (!row || row.length === 0) return '<row r="' + (ri + 1) + '"/>';
    var cells = row.map(function (c, ci) {

    var h = '';

  var pane = '';

    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {

  function num(v, dec) {

  function compact(v) {
    var a = Math.abs(v || 0);

      else if (a >= 1e4) { n = num(v / 1e4, a >= 1e7 ? 0 : 1); u = '万'; }
      else { n = num(v, 0); }
      return CUR[state.cur].sym + n + (u ? '<span class="unit">' + u + '</span>' : '');
    }
    if (a >= 1e9) { n = num(v / 1e9, a >= 1e10 ? 1 : 2); u = 'B'; }
    else if (a >= 1e6) { n = num(v / 1e6, a >= 1e8 ? 1 : 2); u = 'M'; }
    else if (a >= 1e4) { n = num(v / 1e3, 1); u = 'K'; }
    else { n = num(v, 0); }

  function plainCompact(v) {

      if (a >= 1e4) return num(v / 1e4, a >= 1e7 ? 0 : 1) + '万';
      return num(v, 0);
    }
    if (a >= 1e9) return num(v / 1e9, 2) + 'B';

  /* ------------------------ chart ------------------------ */
  function niceMax(x) {
    if (!(x > 0)) return 1;
    var exp = Math.pow(10, Math.floor(Math.log(x) / Math.LN10));
    var f = x / exp;
    var nice = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 4 ? 4 : f <= 5 ? 5 : f <= 6 ? 6 : f <= 8 ? 8 : 10;
    return nice * exp;
  }
  function renderChart(m) {
    var rows = m.rows, n = rows.length;
    var boxW = Math.floor(($('#chart').clientWidth || 0));
    if (!boxW) boxW = 900;
    var narrow = boxW < 560;
    var W = Math.max(300, boxW), H = narrow ? 240 : 340;
    var pl = narrow ? 46 : 64, pr = narrow ? 52 : 104, pt = 14, pb = narrow ? 26 : 34;
    var fs = narrow ? 10 : 11.5, fsAxis = narrow ? 9.5 : 12;
    var iw = W - pl - pr, ih = H - pt - pb;
    var maxPay = 0, maxBal = 0;
    rows.forEach(function (r) {
      maxPay = Math.max(maxPay, r.principal + r.interest);
      maxBal = Math.max(maxBal, r.opening + r.drawdown, r.closing);
    });
    maxPay = niceMax(maxPay); maxBal = niceMax(maxBal);
    var sym = CUR[state.cur].sym;
    var parts = [];
    parts.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="payment profile">');
    /* grids + axes labels */
    for (var g = 0; g <= 4; g++) {
      var y = pt + ih - ih * (g / 4);
      parts.push('<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (pl + iw) + '" y2="' + y.toFixed(1) + '" stroke="' + (g === 0 ? '#cfdbe7' : '#eef3f8') + '" stroke-width="1"/>');
      parts.push('<text x="' + (pl - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="' + fsAxis + '" fill="#93a1b3">' + sym + plainCompact(maxPay * g / 4) + '</text>');
      if (!narrow || g === 0 || g === 4) {
        parts.push('<text x="' + (pl + iw + 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="start" font-size="' + fsAxis + '" fill="#a9b6c4">' + sym + plainCompact(maxBal * g / 4) + '</text>');
      }
    }
    /* bars */
    var slot = iw / n;
    var bw = Math.max(3, Math.min(44, slot * 0.62));
    rows.forEach(function (r, i) {
      var cx = pl + slot * (i + 0.5);
      var hp = ih * (r.principal / maxPay);
      var hi = ih * (r.interest / maxPay);
      var base = pt + ih;
      var x = cx - bw / 2;
      var ti = '<title>#' + r.period + ' · ' + fmtDate(r.end) + ' · ' + t1('thPrincipal') + ' ' + money(r.principal) + ' · ' + t1('thInterest') + ' ' + money(r.interest) + ' · ' + t1('thClosing') + ' ' + money(r.closing) + '</title>';
      parts.push('<g>' + ti +
        '<rect x="' + x.toFixed(1) + '" y="' + (base - hp).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(hp, 0.4).toFixed(1) + '" fill="#173d68" rx="1.5"/>' +
        '<rect x="' + x.toFixed(1) + '" y="' + (base - hp - hi).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(hi, 0.4).toFixed(1) + '" fill="#d3b166" rx="1.5"/>' +
        '</g>');
    });
    /* balance line */
    var pts = rows.map(function (r, i) {
      var x = pl + slot * (i + 0.5);
      var y = pt + ih - ih * (r.closing / maxBal);
      return x.toFixed(1) + ',' + y.toFixed(1);
    });
    parts.push('<polyline points="' + pts.join(' ') + '" fill="none" stroke="#9aabc0" stroke-width="1.4" stroke-dasharray="5 4"/>');
    /* x labels */
    var step = Math.max(1, Math.ceil(n / (narrow ? 4 : 9)));
    rows.forEach(function (r, i) {
      if (i % step !== 0 && i !== n - 1) return;
      parts.push('<text x="' + (pl + slot * (i + 0.5)).toFixed(1) + '" y="' + (H - (narrow ? 9 : 12)) + '" text-anchor="middle" font-size="' + (narrow ? 9.5 : 11.5) + '" fill="#93a1b3">' + shortDate(r.end) + '</text>');
    });
    parts.push('</svg>');
    $('#chart').innerHTML = parts.join('');
    $('#chartMeta').textContent = state.cur + ' · ' + t1('kPeriods') + ' ' + n;
  }

      html = '<i class="dot manual"></i>' + esc(t1('liveLoading'));
    } else if (RATE.state === 'live') {
      html = '<i class="dot live"></i>' + esc(t1('liveOk')) + ' \u00b7 ' + esc(srcName(b)) + ' \u00b7 ' + esc(RATE.date) + ' \u00b7 '  + rateStr(RATE.pct) + srcLink();
    } else if (RATE.state === 'ref') {
      html = '<i class="dot ref"></i>' + esc(t1('liveRef')) + ' \u00b7 ' + esc(srcName(b)) + ' \u00b7 ' + esc(RATE.date) + ' \u00b7 ' + rateStr(RATE.pct) + srcLink();
    } else if (RATE.state === 'manual') {
      html = '<i class="dot manual"></i>' + esc(t1('liveManual'));
      if (RATE.pct != null) html += ' \u00b7 ' + esc(b.name) + ' ' + rateStr(RATE.pct) + ' (' + esc(RATE.date) + ')';
    } else if (RATE.state === 'fail') {
      html = '<i class="dot fail"></i>' + esc(t1('liveFail')) + srcLink();
    } else {
      html = '<i class="dot"></i>' + esc(t1('liveIdle'));
    }
    info.innerHTML = html;
  }

  function applyRateValue(pct) {
    var el = $('#inBase');
    el.value = fmtInput(pct, 4);
    RATE.pct = pct;
    RATE.applied = true;
  }

  function fetchBench(apply, force) {
    var b = bench();
    if (!b.api) {
      try { window.open(b.url, '_blank', 'noopener'); } catch (e) { }
      RATE.state = 'ref';
      RATE.date = b.date; RATE.pct = b.value;
      renderLive();
      return;
    }
    if (RATE.busy) return;
    if (!window.fetch) { RATE.state = 'fail'; renderLive(); return; }
    var curAtStart = state.cur;
    RATE.busy = true;
    renderLive();
    var ctrl = null, timer = null;
    try { if (window.AbortController) ctrl = new AbortController(); } catch (e) { ctrl = null; }
    if (ctrl) timer = setTimeout(function () { try { ctrl.abort(); } catch (e) { } }, 9000);
    fetch(b.api === 'nyfed' ? NYFED : LPRURL, { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        var pct, date;
        if (b.api === 'nyfed') {
          var list = (j && j.refRates) || [];
          if (!list.length) throw new Error('empty');
          pct = parseFloat(list[0].percentRate);
          date = list[0].effectiveDate || '';
        } else {
          var rec = (j && j.records) || [];
          if (!rec.length) throw new Error('empty');
          pct = parseFloat(rec[0]['5Y']);
          date = rec[0].showDateCN || '';
        }
        if (!isFinite(pct)) throw new Error('bad rate');
        if (timer) clearTimeout(timer);
        RATE.busy = false;
        if (state.cur !== curAtStart) { renderLive(); return; }
        RATE.date = date; RATE.pct = pct; RATE.state = 'live';
        if (apply && (force || !RATE.userEdited)) { applyRateValue(pct); render(); }
        renderLive();
      })
      .catch(function () {
        if (timer) clearTimeout(timer);
        RATE.busy = false;
        if (state.cur === curAtStart) RATE.state = 'fail';
        renderLive();
      });
  }

  function setCurrency(code, convert) {
    var old = state.cur;
    state.cur = code;
    if (convert && old !== code && FX.ok) {
      var ro = FX.rates[old], rn = FX.rates[code];
      if (ro && rn) {
        var f = rn / ro;
        $('#inPrice').value = fmtInput(parseNum($('#inPrice').value) * f, 0);
        $('#inIDC').value = fmtInput(parseNum($('#inIDC').value) * f, 0);
      }
    }
    var b = bench();
    RATE.userEdited = false;
    RATE.date = b.date;
    RATE.pct = b.value;
    RATE.state = b.api ? 'live' : 'ref';
    applyRateValue(b.value);
    applyI18n();
    render();
    if (b.api) fetchBench(true, true);
    renderFx();
  }

  /* ------------------------ FX rates ------------------------ */
  function renderFx() {
    var btn = $('#fxBtn'), menu = $('#fxMenu');
    if (!btn || !menu) return;
    var cur = state.cur;
    var shown = cur === 'USD' ? 'EUR' : cur;
    var r = FX.rates[shown];
    var isMan = FX.manual[shown] !== undefined;
    $('#fxBtnTxt').textContent = 'FX \u00b7 ' + shown + ' ' + (FX.ok && r ? num(r, 4) : '\u2014') + (isMan ? '*' : '');
    btn.title = isMan ? t1('fxManual') : '';
    var manualOn = Object.keys(FX.manual).length > 0;
    var rows = ['EUR', 'CNY', 'GBP'].map(function (c) {
      var v = FX.rates[c];
      return '<div class="fxrow"><span>USD \u2192 ' + c + (FX.manual[c] !== undefined ? ' <i class="fxtag">' + esc(t1('fxManual')) + '</i>' : '') + '</span>' +
        '<input class="fxi" data-cur="' + c + '" type="text" inputmode="decimal" value="' + (isFinite(v) ? num(v, 4) : '') + '" placeholder="—"></div>';
    }).join('');
    var eq = '';
    if (state.model && cur !== 'USD' && FX.ok && FX.rates[cur]) {
      var usd = state.model.facility / FX.rates[cur];
      eq = '<div class="fxrow" style="border-top:1px solid #eef3f8;margin-top:4px;padding-top:6px"><span>' +
        esc(t1('fxEquiv')) + '</span><b>$' + num(usd, 0) + '</b></div>';
    }
    menu.innerHTML = '<h4 title="' + esc(t1('fxEditHint')) + '">USD \u00b7 ' + (manualOn ? esc(t1('fxManual')) + ' / ' + esc(t1('fxLive')) : (FX.ok ? esc(t1('fxLive')) : esc(t1('fxIdle'))) ) + '</h4>' + rows + eq +
      '<div class="fxfoot"><span>' + esc(FX.date ? fmtDate(FX.date) : '\u2014') + '</span>' +
      '<button type="button" id="fxRefresh">\u27f3 ' + esc(t1('liveRefresh')) + '</button>' +
      (manualOn ? '<button type="button" id="fxReset" class="fxrst">' + esc(t1('fxReset')) + '</button>' : '') + '</div>';
  }

  function fetchFx() {
    if (FX.busy || !window.fetch) return;
    FX.busy = true;
    fetch('https://open.er-api.com/v6/latest/USD', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        var rates = (j && j.rates) || {};
        FX.live = { EUR: rates.EUR, CNY: rates.CNY, GBP: rates.GBP };
        syncFxRates();
        var dt = new Date(j.time_last_update_utc || '');
        FX.date = isNaN(dt.getTime()) ? '' : dt.toISOString().slice(0, 10);
        FX.busy = false;
        renderFx();
      })
      .catch(function () { FX.busy = false; renderFx(); });
  }

  /* ------------------------ IRR card ------------------------ */
  function renderIRR(m) {
    function rate(v) { return isFinite(v) ? pct(v, 2) : '\u2014'; }
    function bp(v) { return isFinite(v) ? (v > 0 ? '+' : '') + num(v, 0) + ' bp' : '\u2014'; }
    $('#irrAll').textContent = rate(m.irrAllIn);
    $('#irrExcl').textContent = rate(m.irrExcl);
    $('#bpUp').textContent = bp(m.bpUpfront);

  }

  /* ------------------------ sensitivity ------------------------ */
  function renderSens(m) {
    var offs = [-0.02, -0.01, 0, 0.01, 0.02];
    var head = ['sensHead', 'sensInterest', 'sensPI', 'sensPremium', 'sensPRate'];
    var html = '<thead><tr>' + head.map(function (k, i) {
      return '<th>' + esc(t1(k)) + '</th>';
    }).join('') + '</tr></thead><tbody>';
    offs.forEach(function (off) {
      var c = off === 0 ? m : C.computeAtRate(m.inp, m.inp.baseRate + off);
      var cl = off === 0 ? ' class="base"' : '';
      var shiftCls = off > 0 ? 'pos' : off < 0 ? 'neg' : '';
      html += '<tr' + cl + '>' +
        '<td class="' + shiftCls + '">' + (off > 0 ? '+' : '') + num(off * 10000, 0) + ' bp</td>' +
        '<td>' + pct(m.inp.baseRate + off, 4) + '</td>' +
        '<td>' + moneyShort(c.interest) + '</td>' +
        '<td>' + moneyShort(c.pi) + '</td>' +
        '<td>' + moneyShort(c.premium) + '</td>' +
        '<td>' + pct(c.pRate, 4) + '</td>' +
        '</tr>';
    });
    html += '</tbody>';
    $('#sensTable').innerHTML = html;
  }

  /* ------------------------ main render ------------------------ */
  var timer = null;
  function scheduleRender() {
    clearTimeout(timer);
    timer = setTimeout(render, 90);
  }
  function render() {
    var inp = readInputs();
    var msgs = C.validate(inp);
    state.inputs = inp;
    if (msgs.length) {
      showAlert(msgs);
      return;
    }
    showAlert([]);
    var m;
    try { m = C.compute(inp); } catch (e) { showAlert(['vDate']); return; }
    state.model = m;
    renderDerived(m);
    renderKPIs(m);
    renderChart(m);
    renderTable(m);
    renderSens(m);
    renderIRR(m);
    renderFx();
    applyParity(m);
    updatePeriodHints(m.inp.ddMonths !== undefined ? m.inp.ddMonths : m.inp.ddYears * 12, m.inp.repMonths !== undefined ? m.inp.repMonths : m.inp.repYears * 12);
  }

  /* ------------------------ export ------------------------ */
  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function doExport() {
    if (!state.model) return;
    var bytes = C.buildXlsx(state.model, state.langs, state.cur);
    var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var d = new Date();
    var name = 'Sinosure_PI_estimation_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '.xlsx';
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 800);
  }

  /* ------------------------ events ------------------------ */
  function init() {
    writeInputs(C.DEFAULTS);
    applyI18n();
    renderNotes();

    /* language menu */
    $('#langMenu').innerHTML = Object.keys(LANG_MODES).map(function (k) {
      var m = LANG_MODES[k];
      return '<button type="button" data-mode="' + k + '">' + flagsOf(m.langs) +
        '<span class="lname">' + m.label + '</span></button>';
    }).join('');

    function setMenu(open) {
      var menu = $('#langMenu');
      menu.hidden = !open;
      $('#langBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    $('#langBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      setMenu($('#langMenu').hidden);
    });
    $('#langMenu').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]');
      if (!b) return;
      var mode = b.getAttribute('data-mode');
      state.langs = (LANG_MODES[mode] || LANG_MODES.zh).langs.slice();
      setMenu(false);
      applyI18n();
      renderNotes();
      render();
    });
    document.addEventListener('click', function (e) {
      if (!$('#langMenu').hidden && !e.target.closest('.langpick')) setMenu(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setMenu(false);
    });

    /* benchmark rate */
    $('#btnLive').addEventListener('click', function () { fetchBench(true, true); });
    $('#inBase').addEventListener('input', function () {
      RATE.userEdited = true;
      RATE.state = 'manual';
      RATE.applied = false;
      renderLive();
    });

    /* equity : debt */
    ['#inEquity', '#inDebt'].forEach(function (sel) {
      $(sel).addEventListener('input', function () {
        syncEquityDebt(sel === '#inEquity' ? 'eq' : 'debt');
        scheduleRender();
      });
      $(sel).addEventListener('blur', function () { formatField(this); syncEquityDebt(sel === '#inEquity' ? 'eq' : 'debt'); });
    });

    /* thousand separators on blur */
    ['#inPrice', '#inBase', '#inMargin', '#inDD', '#inRep', '#inPrem', '#inIDC']
      .forEach(function (sel) { $(sel).addEventListener('blur', function () { formatField(this); }); });

    renderLangUI();
    renderBench();
    renderLive();
    setTimeout(function () { fetchBench(true); fetchFx(); }, 300);

    $('#curSel').value = state.cur;
    $('#curSel').addEventListener('change', function () {
      setCurrency(this.value, true);
      fetchFx();
    });

    /* FX popover */
    function setFxMenu(open) {
      $('#fxMenu').hidden = !open;
      $('#fxBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    $('#fxBtn').addEventListener('click', function (e) {
      e.stopPropagation();
      setFxMenu($('#fxMenu').hidden);
      if ($('#fxMenu').hidden === false) renderFx();
    });
    $('#fxMenu').addEventListener('change', function (e) {
      var el = e.target.closest('.fxi');
      if (!el) return;
      var c = el.getAttribute('data-cur');
      var val = parseNum(el.value);
      var old = FX.rates[c];
      if (!isFinite(val) || val <= 0) { delete FX.manual[c]; }
      else { FX.manual[c] = val; }
      syncFxRates();
      if (state.cur === c && isFinite(old) && old > 0 && isFinite(FX.rates[c])) {
        var f = FX.rates[c] / old;
        $('#inPrice').value = fmtInput(parseNum($('#inPrice').value) * f, 0);
        $('#inIDC').value = fmtInput(parseNum($('#inIDC').value) * f, 0);
      }
      renderFx();
      render();
    });
    $('#fxMenu').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.classList.contains('fxi')) { e.preventDefault(); e.target.blur(); }
    });
    $('#fxMenu').addEventListener('click', function (e) {
      if (e.target.closest('#fxReset')) {
        var old = FX.rates[state.cur];
        FX.manual = {};
        syncFxRates();
        if (state.cur !== 'USD' && isFinite(old) && old > 0 && isFinite(FX.rates[state.cur])) {
          var f = FX.rates[state.cur] / old;
          $('#inPrice').value = fmtInput(parseNum($('#inPrice').value) * f, 0);
          $('#inIDC').value = fmtInput(parseNum($('#inIDC').value) * f, 0);
        }
        renderFx(); render(); fetchFx(); return;
      }
      if (e.target.closest('#fxRefresh')) fetchFx();
    });
    document.addEventListener('click', function (e) {
      if (!$('#fxMenu').hidden && !e.target.closest('.fxpick')) setFxMenu(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setFxMenu(false);
    });

    $('#scaleSel').addEventListener('change', function () {
      state.scale = parseFloat(this.value);
      if (state.model) renderTable(state.model);
    });

    $('#inPremFin').addEventListener('input', scheduleRender);
    $('#inPremFin').addEventListener('blur', function () {
      var val = parseNum(this.value);
      if (!isFinite(val)) val = 0;
      if (val > 85) val = 85;
      if (val < 0) val = 0;
      this.value = fmtInput(val, 2);
      render();
    });

    ['#inPrice', '#inStart', '#inBase', '#inMargin', '#inDD', '#inRep', '#inPrem', '#inPremFin', '#inBalloon', '#inIDC']
      .forEach(function (s) { $(s).addEventListener('input', scheduleRender); });
    ['#inBasis', '#inFreq', '#inPremBasis'].forEach(function (s) {
      $(s).addEventListener('change', scheduleRender);
    });
    $('#inRepType').addEventListener('change', function () {
      $('#fieldBalloon').hidden = (this.value !== 'balloon');
      scheduleRender();
    });

    var rt = null;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { if (state.model) renderChart(state.model); }, 160);
    });

    $('#btnExport').addEventListener('click', doExport);
    $('#btnPrint').addEventListener('click', function () { window.print(); });
    $('#btnReset').addEventListener('click', function () {
      state.cur = 'USD';
      $('#curSel').value = 'USD';
      writeInputs(C.DEFAULTS);
      applyI18n();
      RATE.state = 'manual';
      RATE.userEdited = true;
      RATE.applied = false;
      renderLive();
      render();
    });

    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

</script>

</body>
</html>
